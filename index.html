<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja de Regalo 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            perspective: 1200px;
            overflow: hidden;
        }

        .scene {
            width: 300px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateScene 25s infinite linear;
        }

        @keyframes rotateScene {
            0% { transform: rotateY(0deg) rotateX(-5deg); }
            100% { transform: rotateY(90deg) rotateX(-5deg); }
        }

        .container {
            position: absolute;
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            transform: translate(-50%, -50%);
        }

        /* Base de la caja */
        .box-base {
            position: absolute;
            width: 200px;
            height: 200px;
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transform: translateY(100px) rotateX(90deg);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.5),
                inset 0 -5px 15px rgba(0, 0, 0, 0.3);
            border-radius: 5px;
        }

        /* Lados de la caja */
        .box-side {
            position: absolute;
            width: 200px;
            height: 200px;
            background: linear-gradient(145deg, #e74c3c, #d35400);
            border: 2px solid rgba(255, 255, 255, 0.1);
            opacity: 0.9;
            border-radius: 5px;
        }

        .side-front { 
            transform: translateZ(100px); 
            background: linear-gradient(145deg, #e74c3c, #c0392b);
        }
        .side-back { transform: translateZ(-100px) rotateY(180deg); }
        .side-left { transform: rotateY(-90deg) translateZ(100px); }
        .side-right { transform: rotateY(90deg) translateZ(100px); }

        /* Tapa de la caja CORREGIDA - se abre horizontalmente */
        .lid {
            position: absolute;
            width: 204px;
            height: 40px;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            transform: translate(-50%, -50%) translateY(-90px) rotateX(0deg);
            transition: transform 3.2s cubic-bezier(0.68, -0.2, 0.27, 1.2);
            transform-origin: center bottom;
            z-index: 20;
        }

        .lid-top {
            position: absolute;
            width: 204px;
            height: 204px;
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transform: translateY(-102px) rotateX(90deg);
            box-shadow: 
                0 -5px 20px rgba(0, 0, 0, 0.3),
                inset 0 5px 10px rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        .lid-side {
            position: absolute;
            width: 204px;
            height: 40px;
            background: linear-gradient(145deg, #e74c3c, #d35400);
            border: 2px solid rgba(255, 255, 255, 0.1);
            opacity: 0.9;
            border-radius: 5px;
        }

        .lid-front { 
            transform: translateZ(102px); 
            background: linear-gradient(145deg, #e74c3c, #c0392b);
        }
        .lid-back { transform: translateZ(-102px) rotateY(180deg); }
        .lid-left { transform: rotateY(-90deg) translateZ(102px); }
        .lid-right { transform: rotateY(90deg) translateZ(102px); }

        /* Listón frontal integrado */
        .ribbon-front {
            position: absolute;
            width: 180px;
            height: 40px;
            background: linear-gradient(45deg, #2c3e50, #34495e);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(101px);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ribbon-knot {
            width: 50px;
            height: 30px;
            background: linear-gradient(45deg, #2c3e50, #34495e);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }

        .ribbon-knot::before,
        .ribbon-knot::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            background: linear-gradient(45deg, #2c3e50, #34495e);
            border-radius: 50%;
            top: -10px;
        }

        .ribbon-knot::before {
            left: -10px;
        }

        .ribbon-knot::after {
            right: -10px;
        }

        /* Listón vertical */
        .ribbon-vertical {
            position: absolute;
            width: 40px;
            height: 180px;
            background: linear-gradient(45deg, #2c3e50, #34495e);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(102px);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border-radius: 3px;
        }

        /* Efectos de brillo */
        .shine {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, 
                transparent 10%, 
                rgba(255, 255, 255, 0.15) 50%, 
                transparent 90%);
            pointer-events: none;
            border-radius: 5px;
        }

        /* Controles */
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            padding: 15px 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 90%;
            z-index: 100;
        }

        button {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            flex: 1;
            min-width: 100px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Animación de apertura de tapa CORREGIDA */
        .scene:hover .lid {
            transform: translate(-50%, -50%) translateY(-290px) rotateX(15deg);
        }

        /* Efecto de cierre mejorado */
        .lid-top::after {
            content: '';
            position: absolute;
            width: 190px;
            height: 190px;
            top: 5px;
            left: 5px;
            background: linear-gradient(145deg, rgba(231, 76, 60, 0.7), rgba(192, 57, 43, 0.7));
            border-radius: 3px;
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.2);
        }

        /* Flores MEJORADAS - más flores y tallos arreglados */
        .flowers-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            pointer-events: none;
            z-index: 5;
        }

        .flower {
            position: absolute;
            opacity: 0;
            transform: translateY(120px) scale(0.8);
            transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .scene:hover .flower {
            opacity: 1;
            transform: translateY(0) scale(1.5);
        }

        /* Posiciones de las flores - muchas más flores distribuidas */
        .flower-1 { top: -120px; left: 30px; transition-delay: 1.4s; } /* Flor izquierda */
        .flower-3 { top: -50px; left: 30px; transition-delay: 1.4s; } /* Flor izquierda */
        .flower-4 { top: -50px; right: 30px; transition-delay: 1.4s; } /* Flor derecha (frente a flor-3) */
        .flower-5 { top: -80px; left: 50px; transition-delay: 1.4s; } /* Flor izquierda */
        .flower-6 { top: -80px; right: 50px; transition-delay: 1.4s; } /* Flor derecha (frente a flor-5) */
        .flower-7 { top: -30px; left: 20px; transition-delay: 1.4s; } /* Flor izquierda */
        .flower-8 { top: -30px; right: 20px; transition-delay: 1.4s; } /* Flor derecha (frente a flor-7) */
        .flower-9 { top: -100px; left: 80px; transition-delay: 1.4s; } /* Flor izquierda */
        .flower-10 { top: -100px; right: 80px; transition-delay: 1.4s; } /* Flor derecha (frente a flor-9) */
        .flower-11 { top: -150px; left: 100px; transition-delay: 1.4s; } /* Flor izquierda */
        .flower-12 { top: -150px; right: 100px; transition-delay: 1.4s; } /* Flor derecha (frente a flor-11) */
        .flower-13 { top: -70px; left: 140px; transition-delay: 1.4s; } /* Flor izquierda */
        .flower-14 { top: -70px; right: 140px; transition-delay: 1.4s; } /* Flor derecha (frente a flor-13) */
        .flower-15 { top: -40px; left: 120px; transition-delay: 1.4s; } /* Flor izquierda */
        .flower-2 { top: -120px; right: 30px; transition-delay: 1.4s; } /* Flor derecha (frente a flor-1) */

        /* Diseño de flor MEJORADO - más grande y tallo arreglado */
        .flower-design {
            width: 90px;
            height: 120px;
            position: relative;
            animation: floatFlower 4s ease-in-out infinite;
        }

        @keyframes floatFlower {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .petal {
            position: absolute;
            width: 30px;
            height: 45px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            border-radius: 50% 50% 50% 0;
            transform-origin: bottom center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            top: 0;
            left: 30px;
        }

        .petal-1 { transform: rotate(0deg); }
        .petal-2 { transform: rotate(45deg); }
        .petal-3 { transform: rotate(90deg); }
        .petal-4 { transform: rotate(135deg); }
        .petal-5 { transform: rotate(180deg); }
        .petal-6 { transform: rotate(225deg); }
        .petal-7 { transform: rotate(270deg); }
        .petal-8 { transform: rotate(315deg); }

        .flower-center {
            position: absolute;
            width: 25px;
            height: 25px;
            background: linear-gradient(45deg, #ffd93d, #ff9f43);
            border-radius: 50%;
            top: 22px;
            left: 37px;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .flower-stem {
            position: absolute;
            width: 6px;
            height: 80px;
            background: linear-gradient(to bottom, #2ecc71, #27ae60);
            top: 45px;
            left: 42px;
            border-radius: 0 0 3px 3px;
            z-index: -1;
        }

        .leaf {
            position: absolute;
            width: 18px;
            height: 12px;
            background: #27ae60;
            border-radius: 50% 0 50% 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .leaf-1 {
            top: 20px;
            left: -8px;
            transform: rotate(-30deg);
        }

        .leaf-2 {
            top: 40px;
            right: -8px;
            transform: rotate(120deg) scaleX(-1);
        }

        /* Efecto de brillo en las flores */
        .flower-shine {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                transparent 30%, 
                rgba(255, 255, 255, 0.3) 50%, 
                transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Instrucciones que aparecen al abrir la caja */
        .instructions {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 25px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 80%;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .scene:hover ~ .instructions {
            opacity: 1;
        }

        .instructions h3 {
            margin-bottom: 8px;
            font-weight: 600;
        }

        .instructions p {
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>

    <div class="controls">
        <button onclick="changeColor('red')">Rojo</button>
        <button onclick="changeColor('green')">Verde</button>
        <button onclick="changeColor('gold')">Dorado</button>
        <button onclick="toggleAnimation()">Pausar/Rotar</button>
    </div>

    <script>
        let isAnimating = true;
        let isLidOpen = false;
        const scene = document.querySelector('.scene');
        const lid = document.getElementById('lid');
        
        function changeColor(color) {
            const colorSchemes = {
                red: { 
                    primary: '#e74c3c', 
                    secondary: '#c0392b', 
                    tertiary: '#d35400',
                    ribbon: '#2c3e50'
                },
                blue: { 
                    primary: '#3498db', 
                    secondary: '#2980b9', 
                    tertiary: '#1abc9c',
                    ribbon: '#34495e'
                },
                green: { 
                    primary: '#2ecc71', 
                    secondary: '#27ae60', 
                    tertiary: '#16a085',
                    ribbon: '#2c3e50'
                },
                gold: { 
                    primary: '#f1c40f', 
                    secondary: '#f39c12', 
                    tertiary: '#e67e22',
                    ribbon: '#d35400'
                },
                purple: { 
                    primary: '#9b59b6', 
                    secondary: '#8e44ad', 
                    tertiary: '#8e44ad',
                    ribbon: '#2c3e50'
                }
            };

            const scheme = colorSchemes[color];
            const boxElements = document.querySelectorAll('.box-base, .lid-top, .box-side, .lid-side');
            const ribbonElements = document.querySelectorAll('.ribbon-front, .ribbon-vertical, .ribbon-knot');
            
            // Cambiar color de la caja
            boxElements.forEach(el => {
                if(el.classList.contains('box-base') || el.classList.contains('lid-top')) {
                    el.style.background = `linear-gradient(145deg, ${scheme.primary}, ${scheme.secondary})`;
                } else if(el.classList.contains('side-front') || el.classList.contains('lid-front')) {
                    el.style.background = `linear-gradient(145deg, ${scheme.primary}, ${scheme.secondary})`;
                } else {
                    el.style.background = `linear-gradient(145deg, ${scheme.primary}, ${scheme.tertiary})`;
                }
            });
            
            // Cambiar color de los listones
            ribbonElements.forEach(el => {
                el.style.background = `linear-gradient(45deg, ${scheme.ribbon}, ${scheme.ribbon})`;
            });
            
            // Cambiar color de los botones
            const buttons = document.querySelectorAll('button');
            buttons.forEach(button => {
                if(!button.onclick.toString().includes('toggleAnimation') && 
                   !button.onclick.toString().includes('toggleLid')) {
                    button.style.background = `linear-gradient(45deg, ${scheme.primary}, ${scheme.secondary})`;
                }
            });
        }

        function toggleAnimation() {
            isAnimating = !isAnimating;
            if (isAnimating) {
                scene.style.animationPlayState = 'running';
            } else {
                scene.style.animationPlayState = 'paused';
            }
        }

        function toggleLid() {
            isLidOpen = !isLidOpen;
            if (isLidOpen) {
                lid.style.transform = 'translate(-50%, -50%) translateY(-290px) rotateX(15deg)';
            } else {
                lid.style.transform = 'translate(-50%, -50%) translateY(-90px) rotateX(0deg)';
            }
        }

        // Interacción con el ratón para rotación manual
        let mouseX = 0;
        let mouseY = 0;
        
        document.addEventListener('mousemove', (e) => {
            if (!isAnimating) {
                mouseX = (e.clientX / window.innerWidth) * 360;
                mouseY = (e.clientY / window.innerHeight) * 20 - 10;
                scene.style.transform = `rotateY(${mouseX}deg) rotateX(${mouseY}deg)`;
            }
        });

        // Actualizar estado de la tapa al hacer hover
        scene.addEventListener('mouseenter', () => {
            isLidOpen = true;
        });

        scene.addEventListener('mouseleave', () => {
            isLidOpen = false;
        });
    </script>
